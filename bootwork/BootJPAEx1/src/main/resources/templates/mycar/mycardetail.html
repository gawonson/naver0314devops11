<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Insert title here</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Dancing+Script:wght@400..700&family=East+Sea+Dokdo&family=Jua&family=Gaegu&family=Gamja+Flower&family=Pacifico&family=Single+Day&display=swap"
          rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <style>
        body * {
            font-family: 'Jua';
        }
    </style>
    <script>
        $(function () {
            list();

        });
        function deleteComment(idx) {

            $.ajax({
                type:"get",
                url:"/mycar/commentdelete",
                data:{"idx":idx},
                success:function () {
                    alert("댓글삭제 성공");
                    list();
                }
            })
        }

        let idx;
        function list(){
            let num=[[${dto.num}]];
            $.ajax({
                type:"get",
                dataType: "json",
                url:"./commentlist",
                data:{"num":num},
                success:function (data) {
                    let s=`댓글 &nbsp;${data.length}개`;
                    $.each(data,function (idx,item) {
                        s+=
                            `
                            <div style="margin-left:20px;">
                                ${item.comment}
                                <span style="color:gray;font-size:0.9em;">${item.writeday}
                                <button type="button" onclick="deleteComment(${item.idx})"><i class="bi bi-trash"></i></button>
                            </span>
                            </div>
                            `
                    });
                    $(".comment-list").html(s);
                }
            })
        }




    </script>
</head>
<body>
<h1>상세보기</h1>
<h3>자동차명:[[${dto.carname}]]</h3>
<button type="button" class="btn btn-outline-secondary btn-sm" onclick="location.href='./list'">목록</button>
<button type="button" class="btn btn-outline-secondary btn-sm" onclick="location.href='./form'">자동차 추가</button>
<button type="button" class="btn btn-outline-secondary btn-sm" th:onclick="|location.href='@{./delete(num=${dto.num})}'|">상품삭제</button>
<button type="button" class="btn btn-outline-secondary btn-sm" th:onclick="|location.href='@{./carupdate(num=${dto.num})}'|">상품수정</button>

<div th:object="${dto}">
    <img th:src="@{'https://kr.object.ncloudstorage.com/bitcamp-gawon-136/mycar/'+*{carphoto}}" style="max-width: 400px ; border: 2px solid pink">
    <br><br>
    <h4>가 격 : [[*{carprice}]]만원</h4>
    <h4>색 상 : <span th:style="'background-color:'+*{carcolor}">[[*{carcolor}]]</span></h4>
    <h4 >구입일 : [[*{carguip}]]</h4>
    <span th:text="${#calendars.format(dto.writeday,'yyyy-MM-dd HH:mm')}"></span>
</div>
<hr>
<h4>댓글 목록</h4>
<div class="comment-list"></div>
<div class="input-group" style="width:400px">
    <h5>comment</h5>
    <input type="text" class="form-control" id="comment" style="margin-left: 10px; border: 1px solid black;">
    <button type="button" class="btn btn-success btn-sm" id="btncomment" >save</button>
</div>

<script>
    //댓글 추가 이벤트
    $("#btncomment").click(function () {
        let num=[[${dto.num}]];
        let comment=$("#comment").val();
        if(comment=='')
            return;
        $.ajax({
            type:"get",
            dataType:"text",
            url:"/mycar/addcomment",
            data:{"num":num,"comment":comment},
            success:function () {
                list();
                $("#comment").val("");
            }
        })
    })
</script>
</body>
</html>
